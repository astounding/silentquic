[package]
name = "silentquic"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "0BSD"
description = "Cloaked QUIC transport: scanner-invisible, PSK-authenticated, camouflaged as vanilla QUIC."
documentation = "https://docs.rs/silentquic"
repository = "https://github.com/astounding/silentquic"
homepage = "https://github.com/astounding/silentquic"
readme = "README.md"
keywords = ["quic", "transport", "psk", "sans-io", "privacy"]
categories = ["network-programming", "cryptography"]

# The root package is also the workspace root. `proto/` holds the sans-IO core
# this crate wraps; see docs/specs/2026-07-05-silentquic-sans-io-core-design.md
[workspace]
members = ["proto"]

[dependencies]
silentquic-proto = { version = "=0.1.0-alpha.1", path = "proto" }
bytes = "1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "log", "bloom"] }
thiserror = "2"
# Only `rt` is required, deliberately NOT `rt-multi-thread`: the runtime flavor
# is the application's choice, and a current-thread runtime is a legitimate and
# useful configuration (one OS thread, cooperative scheduling). Forcing the
# multi-threaded scheduler on every consumer would be wrong.
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
tokio = { version = "1", features = ["full"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
