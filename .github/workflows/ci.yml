name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: cargo package -p quietquic-proto
      - run: cargo package -p quietquic
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: matrix.os == 'ubuntu-latest'
      # The sans-IO core must stay drivable from a hand-rolled event loop, and
      # the reference loop is documentation people copy — so it is compiled and
      # RUN here, not merely built.
      - run: cargo run -p quietquic-proto --example poll_loop
      # The core must never grow a runtime dependency; that is the whole point
      # of the crate split.
      - name: quietquic-proto has no tokio
        run: "! cargo tree -p quietquic-proto | grep -qi tokio"
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # cmake is required: aws-lc-rs compiles native code via cmake, and the
          # build fails with an unobvious error without it.
          prepare: pkg install -y rust cmake
          run: |
            cargo test --workspace --all-targets
            cargo test --workspace --doc
            cargo run -p quietquic-proto --example poll_loop
